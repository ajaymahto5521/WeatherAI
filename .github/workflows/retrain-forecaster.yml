name: Retrain forecaster

# Manual trigger: downloads fresh data, retrains, and uploads the model plus the MLflow store.
on:
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pandas joblib requests mlflow
      - run: python -m scripts.download_weather_data
      - run: python training/train_forecaster.py
      - uses: actions/upload-artifact@v4
        with:
          name: forecaster-retrain
          path: |
            models/forecaster.joblib
            mlflow.db
